<VirtualHost *:443>
	ServerName ${VHOST_WEBCLIENT_NAME}

	<IfModule mod_proxy.c>
		ProxyPreserveHost On
		# Strip client-supplied headers
		RequestHeader unset X-Forwarded-For
		RequestHeader unset X-Real-IP
		RequestHeader unset Client-IP
		RequestHeader unset True-Client-IP
		RequestHeader unset Cf-Connecting_ip
		RequestHeader unset X-Client-IP
		RequestHeader unset X-Originating-IP
		RequestHeader unset Forwarded

		# Set our own based on the real remote address
		RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"

		# Optionally also set X-Real-IP for convenience
		RequestHeader set X-Real-IP "%{REMOTE_ADDR}e"

		ProxyPass "/search/api/" "http://kramerius:8080/search/api/"
		ProxyPassReverse "/search/api/" "http://kramerius:8080/search/api/"

		ProxyPass "/search/openapi/" "http://kramerius:8080/search/openapi/"
		ProxyPassReverse "/search/openapi/" "http://kramerius:8080/search/openapi/"

		ProxyPass "/search/iiif/" "http://kramerius:8080/search/iiif/"
		ProxyPassReverse "/search/iiif/" "http://kramerius:8080/search/iiif/"

		ProxyPass "/search/localPrintPDF" "http://kramerius:8080/search/localPrintPDF"
		ProxyPassReverse "/search/localPrintPDF" "http://kramerius:8080/search/localPrintPDF"

		ProxyPass "/" "http://kramerius_web_client:80/"
		ProxyPassReverse "/" "http://kramerius_web_client:80/"

		#RemoteIPHeader x-forwarded-for
	</IfModule>

	SSLEngine on
	SSLCertificateFile /etc/ssl/kramerius_httpd_proxy/web-fullchain.pem
	SSLCertificateKeyFile /etc/ssl/kramerius_httpd_proxy/web-privkey.pem
</VirtualHost>
<VirtualHost *:443>
	ServerName ${VHOST_KEYCLOAK_NAME}

	<IfModule mod_proxy.c>
		ProxyPreserveHost On

		ProxyPass "/" "http://keycloak_eduid:8080/"
		ProxyPassReverse "/" "http://keycloak_eduid:8080/"

		RemoteIPHeader x-forwarded-for
		RequestHeader set X-Forwarded-Proto "https"
	</IfModule>


	SSLEngine on
	SSLCertificateFile /etc/ssl/kramerius_httpd_proxy/keycloak-fullchain.pem
	SSLCertificateKeyFile /etc/ssl/kramerius_httpd_proxy/keycloak-privkey.pem
</VirtualHost>

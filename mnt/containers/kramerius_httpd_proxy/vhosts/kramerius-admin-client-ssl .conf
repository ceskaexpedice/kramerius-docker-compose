<VirtualHost *:443>
	ServerName ${VHOST_ADMINCLIENT_NAME}

	<IfModule mod_proxy.c>
		ProxyPass "/" "http://kramerius_admin_client:80/"
		ProxyPassReverse "/" "http://kramerius_admin_client:80/"
	</IfModule>

	SSLEngine on
	SSLCertificateFile /etc/ssl/kramerius_httpd_proxy/admin-fullchain.pem
	SSLCertificateKeyFile /etc/ssl/kramerius_httpd_proxy/admin-privkey.pem
</VirtualHost>
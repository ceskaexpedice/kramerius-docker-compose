<VirtualHost *:80>
	ServerName ${VHOST_ADMINCLIENT_NAME}
	DocumentRoot "/usr/local/apache2/htdocs/kramerius-admin"

	<Directory "/usr/local/apache2/htdocs/kramerius-admin">
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted

		RewriteEngine On
		RewriteBase /
		RewriteRule ^index\.html$ - [L]
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule . index.html [L]
	</Directory>
</VirtualHost>
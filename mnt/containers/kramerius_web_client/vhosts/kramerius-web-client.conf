<VirtualHost *:80>
    ServerName ${VHOST_WEBCLIENT_NAME}
    DocumentRoot "/usr/local/apache2/htdocs/kramerius-web-client"

    <Directory "/usr/local/apache2/htdocs/kramerius-web-client">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>